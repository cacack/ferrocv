name: Dependabot Auto-Merge

on: pull_request_target

# The logic lives in cacack/workflows so a fix lands once for every repo that
# calls it, instead of being copy-pasted here and drifting.
#
# Pinned by commit SHA, like every other action here. A tag is mutable — even
# v1.1.0, which is only immutable by convention — and the ecosystems scope
# below is a deliberate policy choice that should not be able to change
# without a commit in this repo. Dependabot bumps the SHA and this comment.
#
# `secrets: inherit` passes this repo's BOT_APP_ID / BOT_PRIVATE_KEY (the
# ferrocv-steward App) through to the called workflow. That App token is what
# GITHUB_TOKEN could not be: it can hold the `workflow` permission GitHub
# demands before enabling auto-merge on a PR touching .github/workflows/*, and
# its push triggers CI on the resulting merge commit.
#
# Scoped to github_actions — cargo updates still merge by hand (see #230).
permissions:
  contents: read

jobs:
  automerge:
    uses: cacack/workflows/.github/workflows/dependabot-automerge.yml@fa3adb379cf9f4c8974491a220e3c19460eed8ba # v1.1.0
    with:
      ecosystems: github_actions
    secrets: inherit
