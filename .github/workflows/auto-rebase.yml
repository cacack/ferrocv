name: auto-rebase

on:
  push:
    branches: [main]

# Token comes from the `ferrocv-release-bot` GitHub App (same App used by
# release-please.yml). Events generated by the default GITHUB_TOKEN do not
# trigger downstream workflows, so rebase pushes it makes would skip CI on
# the rebased PR — defeating the point. App-minted tokens re-trigger CI.
permissions: {}

concurrency:
  group: auto-rebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: peter-evans/rebase@d6f70ba4beda4faa44e582a974ec3b7b40713951 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          exclude: |
            dependabot/**
            release-please--**
